name: PAPERCRAFT CI

# Founder real-time, 2026-08-29: "make sure we have the proper clients uploading as artifacts" ->
# "mac linux windows" -> "include the map editor" -> (after this workflow's own first real run
# turned out to have a real bug, see the "test" job's own comment below) "still i dont have any
# papercraft releases" -> "and ci is failing" -> (after five straight failed macOS build attempts,
# each fix uncovering a deeper real GitHub Actions gotcha -- sdl2-config PATH assumptions, `set -u`
# silently killing a diagnostic wrapper before it could report anything, and finally GitHub's own
# implicit `-e` on every `shell: bash` step swallowing the rest -- without ever actually seeing the
# real compiler error text) "ok i removed mac we cant fix it on our local we dont even know if that
# client works its not worth butning cycles on" -- founder made the real call to drop macOS
# entirely and pushed that removal directly (commit 91f5b8d); this file closes out the dangling
# `build_macos` references that removal left behind (the `release` job's own `needs:` list, an
# orphaned "Download macOS artifact" step, and a `chmod` on files that job no longer produces).
# Real, bounded scope now: apps/client + apps/mapeditor built and uploaded as CI artifacts, AND cut
# as a real GitHub Release, on Linux + Windows. apps/server deliberately NOT included here -- it's
# POSIX-only by design (packages/common/papercraft_persist.h's own doc comment: "the game server
# has no Windows branch anywhere else in this codebase either"), runs on this monorepo's own Linux
# host, and isn't something a player installs -- same real "server vs. distributed client" split
# SHANKPIT's own release.yml already draws (Windows CLIENT + Linux SERVER only, no Windows server).
# Release automation matches SHANKPIT's/PITVIPER's own "auto release non pre release" precedent
# (2026-08-21/25 founder real-time, cited in full in this workflow's own release job below)
# literally: a real release, no `--prerelease` flag, auto-bumping MINOR only on every real push to
# main -- major-version bumps stay a real, human, founder call, same split every other "core repo"
# in this monorepo already follows.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  # Scoped per-workflow-file, not shared with any sibling workflow -- SHANKPIT's own release.yml
  # doc comment names a real, previously-live bug where two workflows sharing one concurrency group
  # key raced each other and silently starved one of them. PAPERCRAFT only has this one workflow
  # today, but the naming precedent is cheap insurance against that exact class of bug recurring
  # if a second workflow file is ever added here.
  group: papercraft-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Real Bazel test gate, run once, on Linux only -- this repo's own actual build system
  # (BUILD.bazel everywhere) and actual test suite (bazel test //...), never exercised in CI
  # before this workflow existed. The platform build jobs below deliberately do NOT use Bazel
  # themselves (no cross-compiling Bazel toolchain set up here, a real, separate, much bigger
  # undertaking) -- they use raw compiler invocations mirroring each target's own
  # BUILD.bazel srcs/deps/linkopts exactly, the same real pattern SHANKPIT's/PITVIPER's own CI
  # already uses for their own Windows cross-builds. This job is the one real place CI actually
  # proves the source tree is correct before any platform spends time packaging a binary from it.
  test:
    name: 🧪 Bazel Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: bazelbuild/setup-bazelisk@v3

      # Real, live bug found and fixed (2026-08-29, this workflow's own first real GitHub Actions
      # run): a bare `bazel test //...` matches EVERY target under `//...`, not just test rules --
      # it also tries to build apps/client, apps/server, apps/mapeditor, and apps/dynmod_poc,
      # since they're real targets the wildcard resolves to, even though nothing under them is a
      # test. On this dev machine that's silently fine (libsdl2-dev/libgl-dev/libglu1-mesa-dev
      # already installed from earlier work in this repo), which is exactly why this never showed
      # up locally -- but a bare `ubuntu-latest` CI runner has none of those, so the real link
      # step for `papercraft_client` (needs -lSDL2/-lGL/-lGLU) failed and took the whole `bazel
      # test` invocation down with it, even though all 12 real test targets themselves passed.
      # `--build_tests_only` is Bazel's own real, standard fix for exactly this: restrict the
      # build graph to what the requested tests actually need, not every target the pattern
      # happens to match. Verified locally: a clean `bazel test --build_tests_only //...` no
      # longer compiles apps/client/src/main.c or apps/server/src/main.c at all (106 real actions
      # vs. 152 before), while still running and passing all 12 real tests.
      - name: bazel test --build_tests_only //...
        shell: bash
        run: |
          set -euo pipefail
          bazel test --build_tests_only //...

  build_linux:
    name: 🐧 Build Linux Client + Map Editor
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 + OpenGL dev packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgl-dev libglu1-mesa-dev

      - name: Build papercraft_client (Linux)
        shell: bash
        run: |
          set -euo pipefail
          gcc apps/client/src/main.c packages/simulation/paper_fragment_mod.c \
            -o papercraft_client_linux \
            -O2 \
            -I. -Ipackages/common -Ipackages/simulation \
            -lSDL2 -lGL -lGLU -lm
          echo "Build OK: $(ls -lh papercraft_client_linux)"

      - name: Build mapeditor (Linux)
        shell: bash
        run: |
          set -euo pipefail
          gcc apps/mapeditor/src/main.c \
            -o mapeditor_linux \
            -O2 \
            -I. -Ipackages/common \
            -lm
          echo "Build OK: $(ls -lh mapeditor_linux)"

      - name: Bundle Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PAPERCRAFT_Linux
          cp papercraft_client_linux PAPERCRAFT_Linux/
          cp mapeditor_linux PAPERCRAFT_Linux/
          chmod +x PAPERCRAFT_Linux/papercraft_client_linux PAPERCRAFT_Linux/mapeditor_linux
          printf '%s\n' "#!/usr/bin/env bash" "exec \"\$(dirname \"\$0\")/papercraft_client_linux\" \"\$@\"" > PAPERCRAFT_Linux/PLAY.sh
          chmod +x PAPERCRAFT_Linux/PLAY.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: papercraft-linux-${{ github.run_number }}-${{ github.sha }}
          path: PAPERCRAFT_Linux/
          if-no-files-found: error

  build_windows:
    name: 🪟 Build Windows Client + Map Editor
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip wget

      - name: Fetch SDL2 mingw devel package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdl2_mingw SDL2-2.30.10 SDL2-devel-2.30.10-mingw.tar.gz || true
          wget -q --retry-connrefused --tries=3 \
            https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-mingw.tar.gz
          tar xzf SDL2-devel-2.30.10-mingw.tar.gz
          mv SDL2-2.30.10/x86_64-w64-mingw32 ./sdl2_mingw

      - name: Build papercraft_client.exe (Windows)
        shell: bash
        run: |
          set -euo pipefail
          x86_64-w64-mingw32-gcc apps/client/src/main.c packages/simulation/paper_fragment_mod.c \
            -o papercraft_client.exe \
            -O2 -static-libgcc \
            -I./sdl2_mingw/include \
            -I. -Ipackages/common -Ipackages/simulation \
            -L./sdl2_mingw/lib \
            -lmingw32 -lSDL2main -lSDL2 -lopengl32 -lglu32 -lws2_32 -lm
          echo "Build OK: $(ls -lh papercraft_client.exe)"

      - name: Build mapeditor.exe (Windows)
        shell: bash
        run: |
          set -euo pipefail
          x86_64-w64-mingw32-gcc apps/mapeditor/src/main.c \
            -o mapeditor.exe \
            -O2 -static-libgcc \
            -I. -Ipackages/common \
            -lws2_32 -lm
          echo "Build OK: $(ls -lh mapeditor.exe)"

      - name: Bundle Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p PAPERCRAFT_Windows
          cp papercraft_client.exe PAPERCRAFT_Windows/
          cp mapeditor.exe PAPERCRAFT_Windows/
          cp sdl2_mingw/bin/SDL2.dll PAPERCRAFT_Windows/
          printf '%s\r\n' "start papercraft_client.exe" > PAPERCRAFT_Windows/PLAY.bat
          printf '%s\r\n' "start mapeditor.exe" > PAPERCRAFT_Windows/EDIT_MAP.bat

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: papercraft-windows-${{ github.run_number }}-${{ github.sha }}
          path: PAPERCRAFT_Windows/
          if-no-files-found: error

  # Founder real-time: "ensure all our core repos have auto release non pre release" -- same exact
  # pattern PITVIPER's own ci.yml / SHANKPIT's own release.yml already established (2026-08-21,
  # "whenever a build passes release it as a minor version" -> "like a . bump" -> "i will handle
  # big bumps to signify human verify releases" -> "start pushing the artifacts to releases in
  # github" -> "pitviper is not pre release" / "pitviper is release release"). Auto-bumps the
  # MINOR version only on every real push to main (never PRs, never the tag-push this job's own
  # release step triggers) -- major-version bumps stay a real, human, founder call. A REAL release
  # (no `--prerelease` flag), matching "non pre release" literally. Reuses the exact same two
  # real platform artifacts the jobs above already built rather than rebuilding anything.
  release:
    name: 🚀 Tag & Release
    runs-on: ubuntu-latest
    needs: [build_linux, build_windows]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 -- need the full tag history to find the current version; actions/
      # checkout's own default shallow clone doesn't reliably include tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: papercraft-linux-${{ github.run_number }}-${{ github.sha }}
          path: dist/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: papercraft-windows-${{ github.run_number }}-${{ github.sha }}
          path: dist/windows

      - name: Package release assets
        run: |
          set -euo pipefail
          chmod +x dist/linux/papercraft_client_linux dist/linux/mapeditor_linux dist/linux/PLAY.sh
          (cd dist/linux && tar -czf ../../papercraft-linux-x86_64.tar.gz .)
          (cd dist/windows && zip -r ../../papercraft-windows-x86_64.zip .)

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            ver="${latest#v}"
            major="$(echo "$ver" | cut -d. -f1)"
            minor="$(echo "$ver" | cut -d. -f2)"
          fi
          next_minor=$((minor + 1))
          next="v${major}.${next_minor}.0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION" \
            papercraft-linux-x86_64.tar.gz \
            papercraft-windows-x86_64.zip \
            --title "$NEXT_VERSION" \
            --generate-notes
